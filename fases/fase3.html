<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fase 3 · Integración CAD — XR Lab UMNG</title>
<link rel="stylesheet" href="../css/xr-ui.css">
<script src="https://cdn.jsdelivr.net/npm/aframe@1.4.1/dist/aframe-master.min.js"></script>
</head>
<body>

  <div class="xr-header">
    <div class="xr-header__bar">
      <div class="xr-header__id">
        <span class="pulse"></span>
        <div>
          <h1>Fase 3 — Integración de modelo CAD</h1>
          <div class="path">index.html / fases / fase3.html</div>
        </div>
      </div>
      <a href="../index.html" class="xr-header__badge">← Panel principal</a>
    </div>
    <div class="xr-toolbar">
      <button class="chip is-active" data-view="modelo"><span class="chip__dot" style="background:#4cc3d9"></span>Ensamblaje 3D</button>
      <button class="chip" data-view="pipeline"><span class="chip__dot" style="background:#ffb454"></span>Cómo se generó</button>
      <button class="chip is-outline" data-view="reload">↻ Reintentar carga</button>
    </div>
  </div>

  <div class="xr-info" id="info">
    <span class="tag" id="tag">PARTE D · MODELO CAD</span>
    <strong id="title">Cargando models/modelo.glb…</strong>
    <span id="text">El ensamblaje se referencia desde la carpeta /models mediante a-asset-item.</span>
  </div>
  <div class="xr-hint">click + arrastrar: mirar · WASD: moverte</div>

  <a-scene vr-mode-ui="enabled: true" xr-mode-ui="enabled: true">

    <a-assets timeout="4000">
      <a-asset-item id="modeloIndustrial" src="../models/modelo.glb"></a-asset-item>
    </a-assets>

    <a-plane rotation="-90 0 0" width="16" height="16" color="#243244"></a-plane>
    <a-sky color="#0f1826"></a-sky>

    <!-- Modelo CAD real -->
    <a-entity id="cad-model"
              gltf-model="#modeloIndustrial"
              position="0 0 -5"
              scale="1 1 1"
              visible="false"
              animation="property: rotation; to: 0 360 0; dur: 18000; loop: true; easing: linear"></a-entity>

    <!-- Marcador de referencia (se activa si el GLB no está disponible) -->
    <a-entity id="cad-placeholder" position="0 0 -5" visible="false"
              animation="property: rotation; to: 0 360 0; dur: 18000; loop: true; easing: linear">
      <a-box position="0 0.55 0" width="1.5" height="1.1" depth="1.5" color="#3a4a5c"></a-box>
      <a-cylinder position="0 1.35 0" radius="0.35" height="0.55" color="#ffb454"></a-cylinder>
      <a-text value="ENSAMBLAJE PENDIENTE\ncoloca models/modelo.glb" align="center" position="0 2.1 0" width="4" color="#eef1f5"></a-text>
    </a-entity>

    <a-entity id="rig" position="0 1.6 2">
      <a-camera look-controls wasd-controls>
        <a-cursor color="#FAFAFA"></a-cursor>
      </a-camera>
    </a-entity>
  </a-scene>

  <script>
    const texts = {
      modelo: {
        loading:  { tag: "PARTE D · MODELO CAD", title: "Cargando models/modelo.glb…", text: "El ensamblaje se referencia desde la carpeta /models mediante a-asset-item." },
        loaded:   { tag: "PARTE D · MODELO CAD", title: "Ensamblaje cargado", text: "models/modelo.glb se cargó correctamente y rota lentamente para su inspección." },
        missing:  { tag: "PARTE D · SIN ARCHIVO", title: "Aún no existe models/modelo.glb", text: "Se muestra un marcador de referencia. Exporta tu ensamblaje de SolidWorks a STL, optimízalo en Blender y guárdalo como models/modelo.glb." }
      },
      pipeline: { tag: "FLUJO DE TRABAJO", title: "SolidWorks → Blender → A-Frame", text: "1) Diseñar el ensamblaje en SolidWorks · 2) Exportar a STL · 3) Importar en Blender y reducir polígonos · 4) Exportar como .glb (< 25 MB) · 5) Referenciarlo con a-asset-item en la escena." }
    };

    const model = document.querySelector('#cad-model');
    const placeholder = document.querySelector('#cad-placeholder');
    const info = document.querySelector('#info');
    const chips = document.querySelectorAll('.chip');
    let modelState = 'loading';

    function paint(data){
      info.innerHTML = `<span class="tag">${data.tag}</span><strong>${data.title}</strong>${data.text}`;
    }

    paint(texts.modelo.loading);

    model.addEventListener('model-loaded', () => {
      modelState = 'loaded';
      model.setAttribute('visible', true);
      placeholder.setAttribute('visible', false);
      document.querySelector('.chip[data-view="modelo"]').classList.contains('is-active') && paint(texts.modelo.loaded);
    });

    model.addEventListener('model-error', () => {
      modelState = 'missing';
      placeholder.setAttribute('visible', true);
      model.setAttribute('visible', false);
      document.querySelector('.chip[data-view="modelo"]').classList.contains('is-active') && paint(texts.modelo.missing);
    });

    chips.forEach(chip => chip.addEventListener('click', () => {
      const view = chip.dataset.view;

      if (view === 'reload'){
        location.reload();
        return;
      }

      chips.forEach(c => { if (c.dataset.view !== 'reload') c.classList.toggle('is-active', c === chip); });

      if (view === 'pipeline'){
        paint(texts.pipeline);
      } else {
        paint(modelState === 'loaded' ? texts.modelo.loaded : modelState === 'missing' ? texts.modelo.missing : texts.modelo.loading);
      }
    }));
  </script>

</body>
</html>
